# Render Blueprint for AI Coach — ALL-IN-ONE variant
#
# Use this if you want to deploy both frontend + backend as a SINGLE
# Render service (1 container, 1 URL). Convenient for the Free tier
# because Render only exposes 1 PORT per service.
#
# Trade-off vs the 2-service variant: both processes share the same
# container — if one crashes, the other dies too. Acceptable for demos
# and low-traffic deployments.
#
# The frontend listens on $PORT (default 10000, what Render exposes).
# The backend listens on :8091 internally. The browser talks to the
# frontend via Render's public URL, and the frontend talks to the
# backend on the same host via http://localhost:8091.

services:
  - type: web
    name: ai-coach
    runtime: docker
    rootDir: .
    dockerfilePath: ./Dockerfile.all-in-one
    dockerContext: .
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"
      # Secrets — set these manually in the Render dashboard.
      # DO NOT commit real values to the repo.
      - key: OMNIROUTE_BASE_URL
        sync: false
      - key: OMNIROUTE_API_KEY
        sync: false
      - key: MINIMAX_API_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: http://localhost:8091
      # Janitor config (optional overrides)
      - key: AUDIO_CLEANUP_INTERVAL_SECONDS
        value: "3600"
      - key: AUDIO_MAX_AGE_SECONDS
        value: "3600"
