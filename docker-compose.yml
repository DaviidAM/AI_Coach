# docker-compose.yml for AI Coach
#
# Single multi-service stack (backend + frontend). Coolify and local
# dev both use this file.
#
# Services:
#   - backend  → Dockerfile.backend  → FastAPI on :8091
#   - frontend → Dockerfile.frontend → Next.js on :3000
#
# Host port allocation (see ~/Hermes/repos/PORT-REGISTRY.md for the
# full registry):
#   - backend  host port 18100 → container 8091
#   - frontend host port 18101 → container 3000
# Range 18xxx reserved for the AI Coach family.
#
# Both services share the same source tree (context: .) but each one
# has its own Dockerfile because the build/runtime images are
# different (Python+slim vs Node).
#
# OmniRoute runs as a systemd service on the host (port 20128); the
# backend reaches it via host.docker.internal:20128. See README.md
# for the full configuration reference and fallback chain.
#
# Run:  docker compose up -d --build
# Stop: docker compose down

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ai-coach-backend:local
    container_name: ai-coach-backend
    restart: unless-stopped
    # Host 18100 → container 8091. See PORT-REGISTRY.md for the
    # port allocation convention (range 18xxx = AI Coach family).
    ports:
      - "${BACKEND_PORT:-18100}:8091"
    # Coolify puts each app in its own private Docker network where
    # 'host.docker.internal' is NOT defined by default. We have to map
    # it explicitly to the network gateway so the backend can reach
    # the systemd OmniRoute service running on the host port 20128.
    # The gateway IP is the .1 address of the bridge network (we use
    # 'host-gateway' which Docker resolves to the actual host gateway
    # on Linux >= 20.10).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=8091
      # OmniRoute gateway — see README "Configuration > Backend" for the
      # full reference. Defaults below match the documented behaviour when
      # no env override is set.
      - OMNIROUTE_BASE_URL=${OMNIROUTE_BASE_URL:-http://host.docker.internal:20128/v1}
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY:-}
      - OMNIROUTE_DEFAULT_MODEL=${OMNIROUTE_DEFAULT_MODEL:-auto/best-chat}
      - OMNIROUTE_DEFAULT_COMBO_FALLBACK=${OMNIROUTE_DEFAULT_COMBO_FALLBACK:-primary-chain}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - AUDIO_CLEANUP_INTERVAL_SECONDS=${AUDIO_CLEANUP_INTERVAL_SECONDS:-3600}
      - AUDIO_MAX_AGE_SECONDS=${AUDIO_MAX_AGE_SECONDS:-3600}
    volumes:
      # Persist runtime audio across container restarts.
      - ai-coach-audio:/app/backend/app/static/audio
      - ai-coach-audio-stt:/app/backend/app/static/audio/stt
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8091/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Baked into the JS bundle at build time. Override via .env or
        # the shell: NEXT_PUBLIC_API_URL=https://api.example.com docker compose build
        #
        # Default: empty string. This makes the frontend use same-origin
        # relative URLs (`fetch("/api/chat")` instead of
        # `fetch("http://backend:8091/api/chat")`), which work whether the
        # app is accessed via https://ai_coach.daviidam.tech from a browser
        # or http://localhost:18101 in local dev. The Next.js rewrites in
        # next.config.js forward /api/* to the backend container.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    image: ai-coach-frontend:local
    container_name: ai-coach-frontend
    restart: unless-stopped
    # Host 18101 → container 3000. See PORT-REGISTRY.md.
    ports:
      - "${FRONTEND_PORT:-18101}:3000"
    # No extra_hosts needed on the frontend: it talks to the backend via
    # the compose-internal DNS name 'backend' (see the Next.js rewrites
    # in next.config.js).
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: ai-coach-network

volumes:
  ai-coach-audio:
  ai-coach-audio-stt:
